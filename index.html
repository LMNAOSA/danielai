<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#02070d">
    <meta name="description" content="DANIEL — No bullshit. No agenda. Just facts. A private, on-device assessment tool.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <title>Daniel - Support Guide</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            teal: '#0d9488',
                            tealLight: '#14b8a6',
                            blue: '#0284c7',
                            slate: '#1e293b',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            color-scheme: dark;
            --daniel-bg: #05090d;
            --daniel-panel: #091118;
            --daniel-panel-raised: #0d1820;
            --daniel-line: #243b47;
            --daniel-line-hot: #3d9db6;
            --daniel-ink: #e6f1f5;
            --daniel-muted: #8fa4af;
            --daniel-cyan: #55d8f4;
            --daniel-blue: #168cc2;
        }

        * { -webkit-tap-highlight-color: transparent; }
        html { background: var(--daniel-bg) !important; }
        body {
            min-height: 100svh;
            padding: clamp(14px, 3vw, 36px) !important;
            background-color: var(--daniel-bg) !important;
            background-image:
                linear-gradient(rgba(73, 137, 158, .065) 1px, transparent 1px),
                linear-gradient(90deg, rgba(73, 137, 158, .065) 1px, transparent 1px) !important;
            background-size: 36px 36px !important;
            background-position: center center;
            color: var(--daniel-ink) !important;
            font-family: "Arial", "Helvetica Neue", sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body > .fixed { display: none !important; }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(2, 9, 14, .92), rgba(2, 9, 14, .3) 52%, rgba(2, 9, 14, .83));
            z-index: 0;
        }
        body::after {
            content: "";
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 3px;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, #087ea7 18%, #5be4f5 52%, #087ea7 82%, transparent);
            opacity: .8;
            z-index: 20;
        }
        #root { width: 100%; max-width: 880px !important; position: relative; z-index: 1; }
        #root::before {
            content: "DANIEL  /  PRIVATE DECISION SUPPORT";
            display: block;
            margin: 0 0 12px 2px;
            color: #6f9aaa;
            font: 600 10px/1.3 "Courier New", monospace;
            letter-spacing: .18em;
        }
        .glass-panel {
            position: relative;
            overflow: hidden;
            background: rgba(7, 14, 20, .96) !important;
            backdrop-filter: none !important;
            border: 1px solid var(--daniel-line) !important;
            border-radius: 8px !important;
            box-shadow: 0 20px 60px rgba(0,0,0,.38), 0 0 0 1px rgba(69, 167, 196, .035) !important;
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 2px;
            background: linear-gradient(90deg, #147a9f 0%, #64e3f5 36%, #1d8eb9 72%, transparent 100%);
            opacity: .9;
        }
        #root .rounded-3xl, #root .rounded-2xl, #root .rounded-xl, #root .rounded-lg {
            border-radius: 6px !important;
        }
        #root h1, #root h2, #root h3 {
            font-family: "Arial", "Helvetica Neue", sans-serif !important;
            letter-spacing: -.035em;
        }
        #root h1 { font-weight: 650 !important; line-height: 1.06 !important; }
        #root h2 { font-weight: 620 !important; line-height: 1.18 !important; }
        #root .text-white { color: #eaf7fb !important; }
        #root .text-slate-200 { color: #c8d8df !important; }
        #root .text-slate-300 { color: #b0c2ca !important; }
        #root .text-slate-400 { color: var(--daniel-muted) !important; }
        #root .text-slate-500 { color: #708792 !important; }
        #root .text-brand-tealLight { color: var(--daniel-cyan) !important; }
        #root .border-slate-700, #root .border-slate-600 { border-color: #28414d !important; }
        #root .bg-slate-950 { background-color: var(--daniel-bg) !important; }

        /* Entry screen: identity first, no centred SaaS welcome-card treatment. */
        #root .glass-panel:has(img[alt="Daniel"]) > div:first-child {
            text-align: left !important;
            margin-bottom: 28px !important;
        }
        #root img[alt="Daniel"] {
            display: block;
            width: min(100%, 470px) !important;
            max-width: min(100%, 470px) !important;
            margin: 0 0 30px !important;
            object-fit: contain;
        }
        #root .glass-panel:has(img[alt="Daniel"]) h1 {
            max-width: 650px;
            font-size: clamp(30px, 5vw, 47px) !important;
            margin-bottom: 12px !important;
        }
        #root .glass-panel:has(img[alt="Daniel"]) p.text-brand-tealLight {
            display: inline-block;
            border-top: 1px solid #2c6477;
            padding-top: 12px;
            font: 600 10px/1.4 "Courier New", monospace !important;
            letter-spacing: .18em !important;
        }
        #root .glass-panel:has(img[alt="Daniel"]) > div:nth-child(2) {
            background: #0a141b !important;
            border: 1px solid #203945 !important;
            border-left: 2px solid #37b7d8 !important;
            margin-bottom: 26px !important;
            padding: clamp(18px, 3vw, 27px) !important;
        }
        #root .glass-panel:has(img[alt="Daniel"]) > div:nth-child(2) > div:first-child {
            background: #101f28 !important;
            border: 1px solid #31515f !important;
            border-radius: 4px !important;
        }
        #root .glass-panel:has(img[alt="Daniel"]) > div:nth-child(2) svg { color: var(--daniel-cyan) !important; }

        #root button {
            border-radius: 5px !important;
            font-family: inherit;
            font-weight: 600;
            transition: border-color .16s ease, background-color .16s ease, color .16s ease, box-shadow .16s ease !important;
            touch-action: manipulation;
        }
        #root button:focus-visible, #root a:focus-visible {
            outline: 2px solid var(--daniel-cyan) !important;
            outline-offset: 3px !important;
        }
        #root button.bg-brand-teal {
            min-height: 54px;
            padding: 16px 25px !important;
            background: var(--daniel-cyan) !important;
            color: #041016 !important;
            border: 1px solid #a4f3ff !important;
            border-radius: 4px !important;
            box-shadow: 0 0 22px rgba(43, 196, 227, .10) !important;
            font: 700 12px/1.2 "Courier New", monospace !important;
            letter-spacing: .11em;
            text-transform: uppercase;
        }
        #root button.bg-brand-teal:hover { background: #a3f0fb !important; box-shadow: 0 0 26px rgba(43, 196, 227, .2) !important; }

        /* Assessment controls: feel like a calibrated instrument, not option cards. */
        #root .glass-panel:has(.space-y-4) .mb-10 {
            margin-bottom: 34px !important;
        }
        #root .glass-panel:has(.space-y-4) .text-sm.text-slate-400 {
            font: 600 10px/1.4 "Courier New", monospace !important;
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        #root .glass-panel:has(.space-y-4) h2 {
            max-width: 690px;
            font-size: clamp(24px, 4vw, 35px) !important;
            margin-bottom: 28px !important;
        }
        #root .glass-panel:has(.space-y-4) button.w-full {
            min-height: 66px;
            padding: 17px 19px !important;
            background: #0b151c !important;
            border: 1px solid #253d49 !important;
            border-radius: 5px !important;
            font-size: 16px !important;
            line-height: 1.35;
        }
        #root .glass-panel:has(.space-y-4) button.w-full:hover {
            background: #10232d !important;
            border-color: #42abc7 !important;
            box-shadow: inset 3px 0 0 var(--daniel-cyan), 0 0 0 1px rgba(79, 211, 240, .05) !important;
        }
        #root .glass-panel:has(.space-y-4) button.w-full > div {
            border-radius: 3px !important;
            border-color: #52717f !important;
            flex-shrink: 0;
            margin-left: 16px;
        }
        #root .glass-panel:has(.space-y-4) button.w-full:hover > div { border-color: var(--daniel-cyan) !important; }
        #root .bg-brand-teal, #root .bg-brand-blue { background-color: var(--daniel-cyan) !important; }
        #root .shadow-\[0_0_10px_rgba\(20\,184\,166\,0\.5\)\] { box-shadow: 0 0 9px rgba(85,216,244,.35) !important; }
        #root .bg-slate-800 { background-color: #14222b !important; }
        #root .bg-slate-900\/60, #root .bg-slate-900\/80 { background-color: #0a141b !important; }
        #root .bg-slate-800\/40 { background-color: #0b151c !important; }
        #root .border-l-brand-teal, #root .border-l-brand-blue { border-left-color: #3bc6e4 !important; }

        /* Results are technical notes, separated by fine rules and restrained colour. */
        #root .glass-panel h3 { font-size: 18px !important; }
        #root .glass-panel .border-l-4 { border-left-width: 2px !important; }
        #root .glass-panel .shadow-inner { box-shadow: none !important; }
        #root .glass-panel a { border-radius: 5px !important; border-color: #294450 !important; }
        #root .glass-panel a:hover { border-color: var(--daniel-cyan) !important; background: #10232d !important; }
        #root .glass-panel button:not(.bg-brand-teal) { border-color: #2b4653; }
        #root .glass-panel .text-orange-200 { color: #f2bd83 !important; }
        #root .glass-panel .text-red-200 { color: #ff9f9f !important; }
        #root .glass-panel .bg-orange-950\/30 { background: #1b140d !important; border-color: #57402a !important; }
        #root .glass-panel .bg-red-950\/30 { background: #1c1012 !important; border-color: #663034 !important; }

        @media (max-width: 560px) {
            body { padding: 12px !important; background-size: 28px 28px !important; }
            #root::before { font-size: 9px; letter-spacing: .12em; margin-bottom: 9px; }
            #root .glass-panel { padding: 22px 18px !important; }
            #root .glass-panel:has(img[alt="Daniel"]) > div:first-child { margin-bottom: 22px !important; }
            #root img[alt="Daniel"] { width: min(100%, 420px) !important; margin-bottom: 26px !important; }
            #root .glass-panel:has(img[alt="Daniel"]) h1 { font-size: clamp(29px, 8.5vw, 39px) !important; }
            #root .glass-panel:has(.space-y-4) .mb-10 { margin-bottom: 25px !important; }
            #root .glass-panel:has(.space-y-4) button.w-full { min-height: 61px; padding: 15px 13px !important; font-size: 15px !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
        }
        @media print {
            body, html { background: white !important; color: black !important; padding: 0 !important; }
            body::before, body::after, #root::before, .no-print { display: none !important; }
            #root { max-width: none !important; }
            .glass-panel, .bg-slate-900, .bg-slate-800, .bg-slate-950, #root .bg-slate-900\/60, #root .bg-slate-900\/80, #root .bg-slate-800\/40 {
                background: white !important; border: none !important; box-shadow: none !important; color: black !important;
            }
            #root .text-slate-200, #root .text-slate-300, #root .text-slate-400, #root .text-slate-500 { color: #333 !important; }
            #root .text-white, #root .text-brand-tealLight { color: black !important; }
            #root .border-slate-700, #root .border-l-brand-teal { border-color: #ccc !important; }
            .print-break-inside-avoid { break-inside: avoid; }
            #root a { text-decoration: none !important; color: black !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 relative overflow-x-hidden">
    
    <div class="fixed top-[-20%] left-[-10%] w-[60%] h-[60%] bg-teal-900/20 blur-[120px] rounded-full pointer-events-none no-print"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-blue-900/20 blur-[120px] rounded-full pointer-events-none no-print"></div>

    <div id="root" class="w-full max-w-3xl z-10"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const QUESTIONS = [
            {
                id: 'living_situation',
                question: "Where do the two girls currently live most of the time?",
                options: [
                    "With their mother",
                    "With me",
                    "Split between us",
                    "With other family/care"
                ]
            },
            {
                id: 'biological_father',
                question: "What is the biological father's legal status and stance?",
                options: [
                    "He's involved and agrees",
                    "He's involved and disagrees",
                    "He is not in the picture/unknown"
                ]
            },
            {
                id: 'relationship',
                question: "Are you and the mother currently together?",
                options: [
                    "Yes",
                    "No - but we co-parent",
                    "No - completely separate"
                ]
            },
            {
                id: 'mother_intention',
                question: "What is the mother's exact position on you taking guardianship?",
                options: [
                    "She wants to hand over full rights",
                    "She wants shared rights",
                    "She is contesting it"
                ]
            },
            {
                id: 'dffh_status',
                question: "What is DFFH's current level of involvement?",
                options: [
                    "Just asking questions/investigating",
                    "They have issued a formal notice or order",
                    "Not involved yet but I'm worried"
                ]
            },
            {
                id: 'dvo_history',
                question: "Regarding the rescinded DVO, who was listed as the protected person?",
                options: [
                    "The mother",
                    "The girls",
                    "A previous partner/someone else"
                ]
            },
            {
                id: 'other_factors',
                question: "Besides the rescinded DVO, are there any other issues DFFH is investigating?",
                options: [
                    "Housing/financial stability",
                    "Substance or health concerns",
                    "No other issues"
                ]
            }
        ];

        function App() {
            const [view, setView] = useState('home'); 
            const [currentStep, setCurrentStep] = useState(0);
            const [answers, setAnswers] = useState({});
            
            const handleStart = () => {
                setView('questions');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleOptionSelect = (option) => {
                const currentQ = QUESTIONS[currentStep];
                const newAnswers = { ...answers, [currentQ.id]: option };
                setAnswers(newAnswers);

                if (currentStep < QUESTIONS.length - 1) {
                    setTimeout(() => setCurrentStep(currentStep + 1), 300);
                } else {
                    setTimeout(() => setView('results'), 400);
                }
            };

            const resetApp = () => {
                setView('home');
                setCurrentStep(0);
                setAnswers({});
            };

            const printDocument = () => {
                window.print();
            };

            const renderHome = () => (
                <div className="glass-panel rounded-3xl p-6 sm:p-12 animate-fade-in shadow-2xl">
                    <div className="text-center mb-8">
                        <img src="logo.png" alt="Daniel" className="mx-auto max-w-xs mb-6 no-print" />
                        <h1 className="text-3xl sm:text-4xl font-bold text-white mb-2 tracking-tight">Danny. Let’s get the facts straight.</h1>
                        <p className="text-brand-tealLight font-medium tracking-wide uppercase text-sm mb-8 no-print">
                            NO BULLSHIT.  NO AGENDA.  JUST FACTS.
                        </p>
                    </div>

                    <div className="bg-slate-900/80 border border-slate-700/60 rounded-2xl p-6 sm:p-8 mb-10 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-1 h-full bg-brand-teal"></div>
                        <div className="flex items-start gap-4">
                            <div className="mt-1 flex-shrink-0 bg-slate-800 p-2 rounded-full border border-slate-600">
                                <svg className="w-6 h-6 text-brand-tealLight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </div>
                            <div>
                                <h2 className="text-lg font-semibold text-white mb-2">SESSION PRIVACY</h2>
                                <p className="text-slate-300 leading-relaxed text-sm sm:text-base">
                                    Your answers are processed in this page and are not submitted to an app database or account. <strong className="text-white">This version does not include an app backend or analytics.</strong> The page loads some libraries and fonts from third-party CDNs, so your browser will make normal requests to those providers. Answers stay in the current page session and are cleared when you reset or close the page; use Print / Save to PDF only if you want to keep a copy.
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="text-center">
                        <button 
                            onClick={handleStart}
                            className="inline-flex items-center justify-center w-full sm:w-auto px-10 py-4 text-lg font-medium text-white transition-all duration-300 bg-brand-teal hover:bg-brand-tealLight rounded-xl shadow-lg hover:shadow-brand-teal/20 focus:outline-none focus:ring-2 focus:ring-brand-tealLight focus:ring-offset-2 focus:ring-offset-slate-900 no-print"
                        >
                            <span>Start assessment</span>
                            <svg className="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </div>
            );

            const renderQuestions = () => {
                const currentQ = QUESTIONS[currentStep];
                const progress = ((currentStep) / QUESTIONS.length) * 100;

                return (
                    <div className="glass-panel rounded-3xl p-6 sm:p-10 animate-slide-up shadow-2xl min-h-[450px] flex flex-col">
                        <div className="mb-10 no-print">
                            <div className="flex justify-between text-sm text-slate-400 mb-3 font-medium">
                                <span>Question {currentStep + 1} of {QUESTIONS.length}</span>
                                <span>{Math.round(progress)}%</span>
                            </div>
                            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div 
                                    className="h-full bg-brand-teal transition-all duration-500 ease-out rounded-full shadow-[0_0_10px_rgba(20,184,166,0.5)]"
                                    style={{ width: `${progress}%` }}
                                ></div>
                            </div>
                        </div>

                        <div className="flex-grow flex flex-col justify-center">
                            <h2 className="text-2xl sm:text-3xl font-semibold text-white mb-8 leading-tight">
                                {currentQ.question}
                            </h2>

                            <div className="space-y-4">
                                {currentQ.options.map((option, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleOptionSelect(option)}
                                        className="w-full text-left p-5 rounded-xl border border-slate-700 bg-slate-800/40 hover:bg-slate-700/80 hover:border-brand-teal/50 transition-all duration-200 text-slate-200 text-lg group flex items-center justify-between"
                                    >
                                        <span>{option}</span>
                                        <div className="w-5 h-5 rounded-full border-2 border-slate-500 group-hover:border-brand-tealLight flex items-center justify-center transition-colors">
                                            <div className="w-2.5 h-2.5 rounded-full bg-transparent group-hover:bg-brand-tealLight transition-colors"></div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderResults = () => {
                const wantsFullRights = answers.mother_intention === "She wants to hand over full rights";
                const fatherDisagrees = answers.biological_father === "He's involved and disagrees";
                const dffhNotice = answers.dffh_status === "They have issued a formal notice or order";
                const dvoProtected = answers.dvo_history;

                return (
                    <div className="glass-panel rounded-3xl p-6 sm:p-10 animate-fade-in shadow-2xl">
                        
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 border-b border-slate-700 pb-6">
                            <div>
                                <h2 className="text-3xl font-bold text-white mb-1">Strategic Action Plan</h2>
                                <p className="text-slate-400">Generated based on your closed-loop assessment.</p>
                            </div>
                            <button 
                                onClick={printDocument}
                                className="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-600 transition-colors no-print"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                                Print / Save to PDF
                            </button>
                        </div>

                        <div className="space-y-6">
                            
                            <div className="bg-slate-900/60 rounded-2xl p-6 sm:p-8 border-l-4 border-l-brand-teal print-break-inside-avoid shadow-inner">
                                <h3 className="text-xl font-bold text-white mb-3">1. Formalizing Guardianship</h3>
                                <p className="text-slate-300 leading-relaxed mb-4">
                                    {wantsFullRights 
                                        ? "It is beneficial that the mother wants to hand over rights. However, under Australian law, a mother cannot simply 'sign over' or write a letter to transfer legal guardianship of a child to a step-parent or partner." 
                                        : "Because the mother's intentions involve shared rights or contestation, informal agreements will not give you the legal authority you need."}
                                    <br/><br/>
                                    <strong>The Reality:</strong> To gain legally recognized guardianship that schools, doctors, and the government (including DFFH) must respect, you must apply for <strong>Consent Orders</strong> through the Federal Circuit and Family Court of Australia. If the mother agrees, this is a paperwork process that usually doesn't require a hearing. 
                                </p>
                                {fatherDisagrees && (
                                    <div className="mt-4 p-4 bg-orange-950/30 border border-orange-900/50 rounded-xl text-orange-200 text-sm">
                                        <strong>Note on the Biological Father:</strong> Because the biological father is involved and disagrees, Consent Orders are more complex. You will likely need to apply for Court-Ordered Parenting Orders, as the court will need to weigh his parental rights against the best interests of the girls.
                                    </div>
                                )}
                            </div>

                            <div className="bg-slate-900/60 rounded-2xl p-6 sm:p-8 border-l-4 border-l-brand-blue print-break-inside-avoid shadow-inner">
                                <h3 className="text-xl font-bold text-white mb-3">2. Addressing DFFH and the Rescinded DVO</h3>
                                <p className="text-slate-300 leading-relaxed mb-4">
                                    Child Protection (DFFH) operates on extreme caution. Even if a DVO was rescinded, their system flags the historical application as a potential risk factor, especially if the protected person was {dvoProtected.toLowerCase()}.
                                </p>
                                <div className="space-y-3">
                                    <div className="flex items-start gap-3">
                                        <div className="mt-1 w-2 h-2 rounded-full bg-brand-blue flex-shrink-0"></div>
                                        <p className="text-slate-300"><strong>Your Action:</strong> You need to proactively neutralize this flag. Do not wait for them to use it against you. Obtain the official court transcripts or police records proving the DVO was rescinded or withdrawn.</p>
                                    </div>
                                    <div className="flex items-start gap-3">
                                        <div className="mt-1 w-2 h-2 rounded-full bg-brand-blue flex-shrink-0"></div>
                                        <p className="text-slate-300"><strong>DFFH Communication:</strong> Keep all interactions with DFFH completely factual, calm, and documented in writing. If they ask about the DVO, provide the rescinded paperwork immediately.</p>
                                    </div>
                                </div>
                                {dffhNotice && (
                                    <div className="mt-5 p-4 bg-red-950/30 border border-red-900/50 rounded-xl text-red-200 text-sm font-medium">
                                        Because DFFH has issued a formal notice or order, time is critical. You must engage a family lawyer immediately. Do not attempt to navigate formal DFFH orders alone, as anything you say can be entered into their permanent assessment.
                                    </div>
                                )}
                            </div>

                            <div className="bg-slate-800/40 rounded-2xl p-6 sm:p-8 border border-slate-700 print-break-inside-avoid">
                                <h3 className="text-xl font-bold text-white mb-5">3. Essential Victorian Resources</h3>
                                <p className="text-slate-400 text-sm mb-6 no-print">Use these official links to begin the formal processes mentioned above.</p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <a href="https://www.fcfcoa.gov.au/fl/children/consent-orders" target="_blank" rel="noopener noreferrer" className="p-5 rounded-xl bg-slate-900/80 hover:bg-slate-700/80 border border-slate-600 transition-colors group flex flex-col justify-between h-full">
                                        <div>
                                            <div className="text-white font-semibold mb-1 group-hover:text-brand-tealLight transition-colors flex justify-between items-start">
                                                Consent Orders (Family Court)
                                                <svg className="w-5 h-5 text-slate-500 no-print" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                            </div>
                                            <div className="text-sm text-slate-400 mt-2">Information on how to formally apply for parenting orders.</div>
                                        </div>
                                        <div className="text-xs text-brand-tealLight mt-4 hidden print:block">https://www.fcfcoa.gov.au/fl/hdi/apply-parenting-orders</div>
                                    </a>

                                    <a href="https://www.legalaid.vic.gov.au/child-protection" target="_blank" rel="noopener noreferrer" className="p-5 rounded-xl bg-slate-900/80 hover:bg-slate-700/80 border border-slate-600 transition-colors group flex flex-col justify-between h-full">
                                        <div>
                                            <div className="text-white font-semibold mb-1 group-hover:text-brand-tealLight transition-colors flex justify-between items-start">
                                                Victoria Legal Aid
                                                <svg className="w-5 h-5 text-slate-500 no-print" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                            </div>
                                            <div className="text-sm text-slate-400 mt-2">Free legal advice regarding DFFH interventions and your rights.</div>
                                        </div>
                                        <div className="text-xs text-brand-tealLight mt-4 hidden print:block">https://www.legalaid.vic.gov.au/child-protection#fact-sheets</div>
                                    </a>
                                </div>
                            </div>
                            
                            <div className="pt-8 flex justify-center no-print border-t border-slate-800">
                                <button 
                                    onClick={resetApp}
                                    className="text-slate-500 hover:text-slate-300 transition-colors text-sm font-medium flex items-center gap-2"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                    Erase memory & Start Over
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full">
                    {view === 'home' && renderHome()}
                    {view === 'questions' && renderQuestions()}
                    {view === 'results' && renderResults()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
